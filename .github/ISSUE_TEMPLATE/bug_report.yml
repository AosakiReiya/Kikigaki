name: Bug report
description: Something breaks or behaves oddly
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report! Please be specific — logs/screenshots help.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      placeholder: Steps to reproduce, expected vs actual
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Area
      options:
        [frontend/themes, admin/CMS, agent, email, comments, self-host/Docker, CI/workflows, other]
    validations:
      required: true
  - type: input
    id: deploy
    attributes:
      label: Deployment
      description: Cloudflare Pages / Docker self-host / wrangler dev, plus version or commit if known
      placeholder: e.g. Docker, v0.x @ abc1234
