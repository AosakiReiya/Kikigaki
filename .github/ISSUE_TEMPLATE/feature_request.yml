name: Feature request
description: Ideas for the roadmap are welcome — big ones especially
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem / motivation
      placeholder: What are you trying to do that's awkward today?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [themes, content-types, agent, email, self-host, admin-ux, other]
