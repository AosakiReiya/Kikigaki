name: Cron — Scheduled Posts

# Keep scheduling disabled until a site URL and the rotated cron secret are configured.
#on:
#  schedule:
#    - cron: '*/10 * * * *'
#  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish-due:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Trigger due scheduled posts
        env:
          PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [[ ! "$PRODUCTION_URL" =~ ^https:// ]] || [ -z "$CRON_SECRET" ]; then
            echo 'Configure an HTTPS PRODUCTION_URL and CRON_SECRET before enabling this workflow.'
            exit 1
          fi
          RESP=$(curl --fail-with-body --silent --show-error -o /tmp/out.json -w '%{http_code}' -X POST \
            -H "x-cron-key: $CRON_SECRET" "${PRODUCTION_URL%/}/api/cron/publish-due")
          cat /tmp/out.json
          [ "$RESP" = '200' ] || exit 1
