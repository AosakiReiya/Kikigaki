<!doctype html>

<html lang="%paraglide.lang%" dir="%paraglide.dir%">
	<head>
		<meta charset="utf-8" />

		<meta name="viewport" content="width=device-width, initial-scale=1" />

		<meta name="text-scale" content="scale" />
		<script>
			// pre-paint 主題：防 FOUC（默認 dark，見 stores/theme.ts）
			try {
				var stored = localStorage.getItem('kikigaki-theme');
				var theme =
					stored === 'light' || stored === 'dark'
						? stored
						: stored === 'auto'
							? matchMedia('(prefers-color-scheme: dark)').matches
								? 'dark'
								: 'light'
							: 'dark';
				document.documentElement.setAttribute('data-theme', theme);
			} catch (e) {
				document.documentElement.setAttribute('data-theme', 'dark');
			}

			// pre-paint 設計主題（Phase 20）：localStorage 鏡像（root layout 由伺服器設定同步），
			// 無鏡像時用基準 abstract；切換至非基準主題時新訪客至多一幀色差（可接受）
			try {
				var ui = localStorage.getItem('kikigaki-ui-theme');
				if (ui !== 'minimal' && ui !== 'terminal' && ui !== 'magazine') ui = 'abstract';
				document.documentElement.setAttribute('data-ui-theme', ui);
			} catch (e) {
				document.documentElement.setAttribute('data-ui-theme', 'abstract');
			}

			// preloader hold：首次載入遮住內容，由 preloader 完成後移除；
			// 3s 超時回落防 JS 失敗卡死；無 JS 時此腳本不執行，內容直出
			// （minimal/terminal 主題關閉 Preloader — 此處清單與 themes/index.ts behavior 同步）
			try {
				var noPreload = ui === 'minimal' || ui === 'terminal';
				if (!noPreload && !matchMedia('(prefers-reduced-motion: reduce)').matches) {
					document.documentElement.classList.add('preloading');
					setTimeout(function () {
						document.documentElement.classList.remove('preloading');
					}, 3000);
				}
			} catch (e) {}

			// 大平板／桌面模式平板：即使回報 pointer:fine，也強制卡片模式
			// （與 layout.css 的 media query 共用 --card-layout 旗標，@container style() 觸發）
			try {
				if (/iPad|Tablet|Android(?!.*Mobile)|Silk/i.test(navigator.userAgent)) {
					document.documentElement.style.setProperty('--card-layout', '1');
				}
			} catch (e) {}
		</script>
		%sveltekit.head%
	</head>

	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
